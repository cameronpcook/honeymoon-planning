name: Fetch hotel photos

on:
  workflow_dispatch:  # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the downloaded images back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch photos
        working-directory: scripts/hotel-photos
        run: |
          chmod +x fetch_photos.sh
          ./fetch_photos.sh ../../hotel-photos

      - name: Commit downloaded photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hotel-photos/
          git diff --staged --quiet || git commit -m "Add hotel photos fetched via manifest"
          git push
